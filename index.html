<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Little Surprise ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hearts" aria-hidden="true"></div>
<button id="music-btn" class="music" aria-label="Play music" hidden>♪</button>

<!-- STAGE 1: PASSWORD -->
<section class="stage active" id="stage-lock">
  <svg class="big-heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
  <h1 class="script">A Little Surprise For Someone Special ❤️</h1>
  <form id="lock-form" autocomplete="off">
    <input id="pw" type="password" placeholder="Enter our secret word" aria-label="Password">
    <button type="submit" class="btn">Unlock My Surprise</button>
    <p id="pw-error" class="error" role="alert"></p>
  </form>
</section>

<!-- STAGE 2: LETTER -->
<section class="stage" id="stage-letter">
  <div class="envelope" id="envelope">
    <div class="env-back"></div>
    <div class="card"></div>
    <div class="env-front"></div>
    <div class="flap"></div>
    <button class="pin" id="pin" aria-label="Open the letter">
      <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/><ellipse cx="8" cy="7" rx="2.2" ry="1.2" transform="rotate(-35 8 7)" fill="#fff" opacity=".5"/></svg>
    </button>
  </div>
  <p class="hint" id="hint">Tap the heart to open ❤️</p>
  <div class="paper" id="paper">
    <p id="typed" class="typed"></p>
  </div>
  <button class="btn hidden" id="to-memories">See Our Memories ❤️</button>
</section>

<!-- STAGE 3: MEMORIES -->
<section class="stage" id="stage-memories">
  <figure class="slide" id="slide">
    <img id="slide-img" alt="">
    <div class="placeholder" id="slide-ph"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span>Our photo goes here</span></div>
    <figcaption id="slide-cap" class="script"></figcaption>
  </figure>
  <div class="final hidden" id="final">
    <svg class="big-heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    <h2 class="script">Every moment with you is my favorite memory ❤️</h2>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
